# `:?` makes a missing .env value an error instead of a silent empty string.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Not published to the host; reachable only on the Compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      PRACTICE_TIMEZONE: ${PRACTICE_TIMEZONE:-America/New_York}
      # Optional. Empty means generated summaries are off.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8000:8000"
    # Wait for Postgres to accept connections, not just for the container to start.
    depends_on:
      db:
        condition: service_healthy

  # The web app. nginx serves the built frontend and forwards /api to the api service.
  web:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      - api

  # Runs the API test suite against a separate *_test database: docker compose run --rm test
  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}_test
    depends_on:
      db:
        condition: service_healthy

  # Runs the browser tests against the running web app: docker compose --profile e2e run --rm e2e
  # The tests create and delete their own patients in the app's database.
  e2e:
    profiles: [e2e]
    build:
      context: ./frontend
      target: e2e
    environment:
      E2E_BASE_URL: http://web
    # Failure traces land in frontend/test-results on the host.
    volumes:
      - ./frontend/test-results:/app/test-results
    depends_on:
      - web

volumes:
  pgdata:
