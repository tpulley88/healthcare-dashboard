# Leave query strings out of the access log, so patient name searches aren't recorded.
log_format no_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    access_log /var/log/nginx/access.log no_query;

    root /usr/share/nginx/html;

    # The trailing slash on proxy_pass removes the /api prefix: /api/patients -> /patients.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The app handles its own routes, so any path that isn't a file gets index.html.
    location / {
        try_files $uri /index.html;
    }
}
